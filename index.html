<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Gay Bar</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#161619; overflow:hidden; }
  body { font-family:"Open Sans","Segoe UI",Tahoma,Arial,sans-serif; color:#e6e6ea; }
  #fall { position:absolute; top:0; left:0; }
  #stage { position:absolute; top:26%; left:300px; right:300px; text-align:center; }
  .line { font-size:46px; font-weight:700; line-height:1.15; letter-spacing:-0.02em;
          margin:10px auto; max-width:100%; color:#e6e6ea;
          opacity:0; filter:alpha(opacity=0); }
  #bar { position:absolute; bottom:20px; left:0; width:100%; text-align:center; }
  #status { display:inline-block; background:#1e1e22; border:1px solid #2e2e34;
            padding:6px 10px; font-size:12px; color:#9a9aa4; }
  .k { color:#6f6f79; }
  .v { color:#e6e6ea; margin-right:14px; }
  #players { position:absolute; top:20px; right:20px; width:250px;
             background:#1e1e22; border:1px solid #2e2e34; padding:8px 10px 9px;
             font-size:12px; text-align:left; }
  #players .cap { color:#9a9aa4; font-size:11px; letter-spacing:0.06em;
                  text-transform:uppercase; padding-bottom:6px;
                  border-bottom:1px solid #2e2e34; margin-bottom:6px; }
  #players .cap b { color:#74c757; font-weight:700; }
  #plist { max-height:260px; overflow:hidden; }
  #plist div { color:#e6e6ea; padding:2px 0; white-space:nowrap;
               overflow:hidden; text-overflow:ellipsis; }
  #plist div.row { color:#e6e6ea; padding:2px 0; white-space:nowrap; overflow:hidden; }
  #plist .nm { display:inline-block; width:130px; overflow:hidden;
               text-overflow:ellipsis; vertical-align:bottom; }
  #plist .sc { display:inline-block; width:34px; text-align:right; color:#9a9aa4; }
  #plist .tm { display:inline-block; width:52px; text-align:right; color:#6f6f79; }
  #plist .hd { color:#6f6f79; font-size:11px; padding-bottom:3px; }
  #plist .empty { color:#6f6f79; }
  #addons { position:absolute; top:20px; left:20px; width:250px;
            background:#1e1e22; border:1px solid #2e2e34; padding:8px 10px 9px;
            font-size:12px; text-align:left; }
  #addons .cap { color:#9a9aa4; font-size:11px; letter-spacing:0.06em;
                 text-transform:uppercase; padding-bottom:6px;
                 border-bottom:1px solid #2e2e34; margin-bottom:6px; }
  #addons .cap b { color:#74c757; font-weight:700; }
  #alist { height:300px; overflow:hidden; }
  #alist div { color:#e6e6ea; padding:2px 0; white-space:nowrap;
               overflow:hidden; text-overflow:ellipsis; }
  a { color:#74c757; text-decoration:none; }
  a:hover { color:#8fd977; }
</style>
</head>
<body>
<canvas id="fall"></canvas>
<div id="addons">
  <div class="cap">Addons <b id="acount">-</b></div>
  <div id="alist"></div>
</div>
<div id="stage">
  <div class="line" id="l1">Gay Bar with absolutely no gay people of color</div>
  <div class="line" id="l2">I mean the rainbow</div>
  <div class="line" id="l3">obviously</div>
  <div class="line" id="l4">You racist fuck.</div>
</div>
<div id="players">
  <div class="cap">Players <b id="pcount">-</b></div>
  <div id="plist"><div class="empty">Waiting for server</div></div>
</div>
<div id="bar"><div id="status"></div></div>
<script type="text/javascript">
/* Everything below is ES5 + setInterval only: no rAF, no CSS animation,
   no flexbox, no fetch, no arrow functions. Works in Awesomium and CEF. */
(function () {
  var TICK = 33;

  /* ---- addon list: filled at runtime from the server, never hardcoded ----
     Sources, in priority order:
       1. window.SetAddonList(names)  — call from your loading-screen Lua
       2. ADDONS_JSON                 — your own {"addons":[...],"total":n} feed
       3. GMod's own DownloadingFile/SetFilesTotal hooks (what the client is
          actually mounting right now)
       4. the A2S rules the server publishes (workshop/addon keys) */
  var ADDONS_JSON = "";      /* optional: e.g. "https://yoursite.com/addons.json" */
  /* Live Workshop collection the server runs. Steam's API blocks browsers, so the
     collection page is read through a CORS proxy and its titles parsed out. */
  var COLLECTION_ID = "3785829915";
  var CORS_PROXY = "https://corsproxy.io/?url=";
  var ADDONS = [];
  var ADDON_SEEN = {};
  var ADDON_TOTAL = 0;

  /* ============================================================
     CONFIG — point this at a JSON endpoint that reports players.
     GMod's loading screen gets no live player data from the game,
     so the count must come from your own server/webhost.
     Accepted shapes:
       {"players":["Name","Name"],"maxplayers":10}
       {"players":[{"name":"Name"}],"maxplayers":10}
       {"numplayers":3,"maxplayers":10}
     Must be served with: Access-Control-Allow-Origin: *
     ============================================================ */
  var PLAYERS_JSON = "";        /* optional: your own JSON feed, overrides the API below */
  var POLL_MS = 5000;

  /* Public A2S bridge (CORS-enabled) — returns live count and the real player list */
  var API = "https://gameserveranalytics.com/api/v2/query";
  var SERVER_IP = "73.179.76.189";
  var SERVER_PORT = "27015";

  function setOpacity(el, v) {
    el.style.opacity = v;
    el.style.filter = "alpha(opacity=" + Math.round(v * 100) + ")";
  }
  function fade(el, ms) {
    var start = new Date().getTime();
    var iv = setInterval(function () {
      var p = (new Date().getTime() - start) / ms;
      if (p >= 1) { p = 1; clearInterval(iv); }
      setOpacity(el, p);
    }, TICK);
    setOpacity(el, 0);
  }

  var l1 = document.getElementById("l1"),
      l2 = document.getElementById("l2"),
      l3 = document.getElementById("l3"),
      l4 = document.getElementById("l4");

  fade(l1, 3000);
  setTimeout(function () { fade(l2, 1500); }, 3000);
  setTimeout(function () { fade(l3, 1500); }, 5000);
  setTimeout(function () {
    l1.style.display = "none";
    l2.style.display = "none";
    l3.style.display = "none";
    fade(l4, 1500);
  }, 10000);

  /* ---- server info: GMod calls these globals itself ---- */
  var info = { hostname: "", map: "", gamemode: "", steamid: "",
               numplayers: null, maxplayers: null, list: [], listAt: 0, countAt: 0 };

  function q(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search || "");
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }
  if (q("hostname")) info.hostname = q("hostname");
  info.map = q("mapname");
  info.gamemode = q("gamemode");
  info.steamid = q("steamid");
  if (q("maxplayers")) info.maxplayers = parseInt(q("maxplayers"), 10);
  if (q("numplayers")) { info.numplayers = parseInt(q("numplayers"), 10); info.countAt = 1; }

  /* players=Name1,Name2,... — set by the server on the loading URL */
  var rawList = q("players") || q("playerlist");
  if (rawList) {
    var parts = rawList.split(","), k;
    for (k = 0; k < parts.length; k++) {
      var nm = parts[k].replace(/^\s+|\s+$/g, "");
      if (nm) info.list.push({ name: nm, score: null, time: "" });
    }
    if (info.list.length) info.listAt = 1;
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function count() {
    /* whichever source reported most recently wins */
    if (info.list.length && info.listAt >= info.countAt) return info.list.length;
    if (info.numplayers !== null && !isNaN(info.numplayers)) return info.numplayers;
    if (info.list.length) return info.list.length;
    if (info.maxplayers !== null && !isNaN(info.maxplayers)) return 1; /* you, connecting */
    return null;
  }

  function playersText() {
    var n = count();
    var mx = (info.maxplayers !== null && !isNaN(info.maxplayers)) ? info.maxplayers : null;
    if (n === null && mx === null) return "-";
    if (n === null) return "?/" + mx;
    if (mx === null) return String(n);
    return n + "/" + mx;
  }

  var statusEl = document.getElementById("status"),
      countEl = document.getElementById("pcount"),
      listEl = document.getElementById("plist");

  function paint() {
    var rows = [
      ["Server", info.hostname || "-"],
      ["Map", info.map || "-"],
      ["Gamemode", info.gamemode || "-"],
      ["Players", playersText()],
      ["SteamID", info.steamid || "-"]
    ], h = "", i;
    for (i = 0; i < rows.length; i++) {
      h += '<span class="k">' + rows[i][0] + '</span> <span class="v">' + rows[i][1] + '</span>';
    }
    statusEl.innerHTML = h;

    countEl.innerHTML = playersText();
    var stale = info.list.length && info.countAt > info.listAt &&
                info.numplayers !== null && info.numplayers !== info.list.length;
    if (info.list.length && !stale) {
      var lh = '<div class="row hd"><span class="nm">Name</span>' +
               '<span class="sc">Score</span><span class="tm">Time</span></div>';
      for (i = 0; i < info.list.length; i++) {
        var p = info.list[i];
        lh += '<div class="row"><span class="nm">' + esc(p.name) + '</span>' +
              '<span class="sc">' + (p.score === null ? "" : p.score) + '</span>' +
              '<span class="tm">' + esc(p.time || "") + '</span></div>';
      }
      listEl.innerHTML = lh;
    } else if (count() === 0) {
      listEl.innerHTML = '<div class="empty">Server is empty</div>';
    } else if (count() === 1 && info.numplayers === null) {
      listEl.innerHTML = '<div class="empty">Connecting</div>';
    } else {
      listEl.innerHTML = '<div class="empty">No player list sent</div>';
    }
  }
  paint();

  window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode) {
    if (servername) info.hostname = servername;
    /* serverurl looks like "73.179.76.189:27015" — aim the API at the live server */
    if (serverurl) {
      var m = /(\d+\.\d+\.\d+\.\d+)(?::(\d+))?/.exec(serverurl);
      if (m) { SERVER_IP = m[1]; if (m[2]) SERVER_PORT = m[2]; }
    }
    if (mapname) info.map = mapname;
    if (gamemode) info.gamemode = gamemode;
    if (maxplayers) info.maxplayers = parseInt(maxplayers, 10);
    if (steamid) info.steamid = steamid;
    paint();
    poll();
  };

  /* Server-side hooks: call either from Lua via loading-screen JS. */
  window.SetPlayerList = function (names) {
    var out = [], i;
    if (typeof names === "string") {
      try { names = JSON.parse(names); } catch (e) { names = names.split(","); }
    }
    if (names && names.length) {
      for (i = 0; i < names.length; i++) {
        var n = names[i];
        if (n && typeof n === "object") {
          out.push({ name: String(n.name || n.nick || ""), score: null, time: "" });
        } else {
          n = String(n).replace(/^\s+|\s+$/g, "");
          if (n) out.push({ name: n, score: null, time: "" });
        }
      }
    }
    info.list = out;
    info.listAt = new Date().getTime();
    paint();
  };
  window.SetPlayerCount = function (n, mx) {
    info.numplayers = parseInt(n, 10);
    info.countAt = new Date().getTime();
    if (mx) info.maxplayers = parseInt(mx, 10);
    paint();
  };

  /* ---- addon panel: repaints whenever the server sends more ---- */
  var aCountEl = document.getElementById("acount"),
      aListEl = document.getElementById("alist"),
      aInner = document.createElement("div"),
      aScroll = 0;
  aInner.style.position = "relative";
  aListEl.innerHTML = "";
  aListEl.appendChild(aInner);

  function paintAddons() {
    var total = ADDON_TOTAL > ADDONS.length ? ADDON_TOTAL : ADDONS.length;
    aCountEl.innerHTML = total ? total : "-";
    if (!ADDONS.length) {
      aInner.innerHTML = '<div style="color:#6f6f79">Waiting for server</div>';
      return;
    }
    var h2 = "", i;
    for (i = 0; i < ADDONS.length; i++) h2 += "<div>" + esc(ADDONS[i]) + "</div>";
    if (total > ADDONS.length) {
      h2 += '<div style="color:#6f6f79">+ ' + (total - ADDONS.length) + ' more</div>';
    }
    aInner.innerHTML = h2;
  }
  paintAddons();

  setInterval(function () {
    var span = aInner.offsetHeight - aListEl.offsetHeight;
    if (span <= 0) { aInner.style.top = "0px"; return; }
    aScroll += 0.25;
    if (aScroll > span + 40) aScroll = 0;
    aInner.style.top = (-Math.min(aScroll, span)) + "px";
  }, TICK);

  function addAddon(name) {
    name = String(name).replace(/^\s+|\s+$/g, "");
    if (!name || ADDON_SEEN[name]) return false;
    ADDON_SEEN[name] = 1;
    ADDONS.push(name);
    return true;
  }

  /* pretty-print a raw download path into an addon-ish name */
  function niceName(path) {
    var p = String(path).replace(/\\/g, "/");
    var m = /([^\/]+)\.gma$/i.exec(p);
    if (m) return m[1].replace(/[_\-]+/g, " ");
    m = /^(?:.*?\/)?(addons|workshop)\/([^\/]+)/i.exec(p);
    if (m) return m[2].replace(/[_\-]+/g, " ");
    m = /^[^\/]+\/([^\/]+)\//.exec(p);
    if (m) return m[1].replace(/[_\-]+/g, " ");
    return p;
  }

  /* 1. Lua-driven: SetAddonList({"Name", ...}) or a JSON string */
  window.SetAddonList = function (names, total) {
    if (typeof names === "string") {
      try { names = JSON.parse(names); } catch (e) { names = names.split(","); }
    }
    if (!names || names.length === undefined) return;
    ADDONS = []; ADDON_SEEN = {};
    for (var i = 0; i < names.length; i++) {
      var n = names[i];
      if (n && typeof n === "object") n = n.title || n.name || n.file || "";
      addAddon(n);
    }
    ADDON_TOTAL = total ? parseInt(total, 10) : ADDONS.length;
    paintAddons();
  };

  /* 3. GMod's own download hooks report the real mount list as it arrives */
  window.SetFilesTotal = function (n) {
    n = parseInt(n, 10);
    if (!isNaN(n) && n > ADDON_TOTAL) { ADDON_TOTAL = n; paintAddons(); }
  };
  window.SetFilesNeeded = function () {};
  window.DownloadingFile = function (fileName) {
    if (!fileName) return;
    if (addAddon(niceName(fileName))) paintAddons();
  };

  /* 2. optional JSON feed */
  function applyAddonFeed(d) {
    if (!d) return;
    var src = d.addons || d.list || d.workshop || d;
    if (typeof d.total !== "undefined") ADDON_TOTAL = parseInt(d.total, 10);
    if (!src || src.length === undefined || typeof src === "string") return;
    ADDONS = []; ADDON_SEEN = {};
    for (var i = 0; i < src.length; i++) {
      var n = src[i];
      if (n && typeof n === "object") n = n.title || n.name || n.file || "";
      addAddon(n);
    }
    if (!ADDON_TOTAL || ADDON_TOTAL < ADDONS.length) ADDON_TOTAL = ADDONS.length;
    paintAddons();
  }

  /* 5. live Workshop collection through the CORS proxy (cached locally) */
  var ADDON_CACHE_KEY = "gb_addons_" + COLLECTION_ID;

  function setAddons(names, total) {
    ADDONS = []; ADDON_SEEN = {};
    for (var i = 0; i < names.length; i++) addAddon(names[i]);
    ADDON_TOTAL = total && total > ADDONS.length ? total : ADDONS.length;
    paintAddons();
  }

  function loadCachedAddons() {
    try {
      var raw = window.localStorage && localStorage.getItem(ADDON_CACHE_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && d.names && d.names.length) setAddons(d.names, d.total);
    } catch (e) {}
  }

  function fetchCollection() {
    if (!COLLECTION_ID || !CORS_PROXY) return;
    var target = "https://steamcommunity.com/sharedfiles/filedetails/?id=" + COLLECTION_ID;
    var x;
    try { x = new XMLHttpRequest(); } catch (e) { return; }
    try { x.open("GET", CORS_PROXY + encodeURIComponent(target), true); } catch (e2) { return; }
    x.onreadystatechange = function () {
      if (x.readyState !== 4 || x.status !== 200) return;
      var t = x.responseText, re = /workshopItemTitle[^>]*>([\s\S]*?)</g, m, names = [];
      while ((m = re.exec(t))) {
        var n = m[1].replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
                    .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
                    .replace(/^\s+|\s+$/g, "");
        if (n) names.push(n);
      }
      /* the first title on the page is the collection itself */
      if (names.length > 1) names.shift();
      if (!names.length) return;
      var tm = /Items\s*\((\d+)\)/.exec(t);
      var total = tm ? parseInt(tm[1], 10) : names.length;
      setAddons(names, total);
      try {
        if (window.localStorage) {
          localStorage.setItem(ADDON_CACHE_KEY, JSON.stringify({ names: names, total: total }));
        }
      } catch (e3) {}
    };
    try { x.send(null); } catch (e4) {}
  }

  loadCachedAddons();
  fetchCollection();

  /* 4. addon/workshop keys out of the server's published A2S rules */
  function applyRules(d) {
    if (!d) return;
    var rules = d.rules || d, key, added = false;
    for (key in rules) {
      if (!rules.hasOwnProperty(key)) continue;
      if (!/addon|workshop|mount/i.test(key)) continue;
      var val = String(rules[key]);
      var parts = val.split(/[,;]/);
      for (var i = 0; i < parts.length; i++) {
        if (parts[i] && addAddon(niceName(parts[i]))) added = true;
      }
    }
    if (added) paintAddons();
  }

  /* ---- poll PLAYERS_JSON if configured (XHR: works in Awesomium + CEF) ---- */
  function applyFeed(d) {
    if (!d) return;
    if (d.maxplayers) info.maxplayers = parseInt(d.maxplayers, 10);
    else if (d.max) info.maxplayers = parseInt(d.max, 10);
    if (d.numplayers !== undefined) {
      info.numplayers = parseInt(d.numplayers, 10);
      info.countAt = new Date().getTime();
    }
    var src = d.players || d.list || d.playerlist;
    if (src && src.length !== undefined && typeof src !== "string") {
      var out = [], i;
      for (i = 0; i < src.length; i++) {
        var n = src[i], nm, sc = null, tm = "";
        if (n && typeof n === "object") {
          nm = n.name || n.nick || n.nickname || "";
          if (n.score !== undefined) sc = n.score;
          tm = n.duration_formatted || n.time || "";
        } else { nm = n; }
        nm = String(nm).replace(/^\s+|\s+$/g, "");
        if (nm) out.push({ name: nm, score: sc, time: tm });
      }
      info.list = out;
      info.numplayers = out.length;
      info.listAt = new Date().getTime();
      info.countAt = info.listAt;
    } else if (typeof src === "number") {
      info.numplayers = src;
      info.countAt = new Date().getTime();
    }
    paint();
  }

  function poll() {
    if (ADDONS_JSON) pollUrl(ADDONS_JSON, applyAddonFeed);
    if (PLAYERS_JSON) { pollUrl(PLAYERS_JSON, applyFeed); return; }
    if (!API || !SERVER_IP) return;
    var base = API + "?ip=" + SERVER_IP + "&port=" + SERVER_PORT + "&game=source";
    pollUrl(base, function (d) {
      if (!d) return;
      if (d.name) info.hostname = d.name;
      if (d.map) info.map = d.map;
      if (d.version) info.gamemode = d.version;
      if (d.max_players) info.maxplayers = parseInt(d.max_players, 10);
      if (d.players !== undefined && typeof d.players === "number") {
        info.numplayers = d.players;
        info.countAt = new Date().getTime();
      }
      paint();
    });
    pollUrl(base + "&type=players", function (d) {
      if (!d || d.length === undefined) return;
      applyFeed({ players: d });
    });
  }

  function pollUrl(u, done) {
    var x;
    try { x = new XMLHttpRequest(); } catch (e) { return; }
    var url = u + (u.indexOf("?") > -1 ? "&" : "?") + "_=" + new Date().getTime();
    try { x.open("GET", url, true); } catch (e2) { return; }
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status !== 200) return;
      var d = null;
      try { d = JSON.parse(x.responseText); } catch (e3) { return; }
      done(d);
    };
    try { x.send(null); } catch (e4) {}
  }
  poll();
  setInterval(poll, POLL_MS);
  window.SetStatusChanged = function () {};

  /* ---- blizzard of falling G ---- */
  var c = document.getElementById("fall");
  if (!c || !c.getContext) return;
  var ctx = c.getContext("2d");
  if (!ctx) return;

  var TIERS = [
    { size: 5,  colour: "#202025" },
    { size: 8,  colour: "#26262c" },
    { size: 12, colour: "#2d2d34" }
  ];
  var W = 0, H = 0, flakes = [], SPEED = 0.8;

  function make(seeded) {
    var t = TIERS[Math.floor(Math.random() * 3)];
    return {
      x: Math.random() * W,
      y: seeded ? Math.random() * H : -t.size * 4,
      speed: 0.6 + Math.random() * 0.8,
      size: t.size,
      colour: t.colour,
      drift: 6 + Math.random() * 16,
      phase: Math.random() * 6.28
    };
  }
  function vw() { return window.innerWidth || document.documentElement.clientWidth || 1280; }
  function vh() { return window.innerHeight || document.documentElement.clientHeight || 720; }
  function resize() {
    W = vw(); H = vh();
    c.width = W; c.height = H;
    c.style.width = W + "px"; c.style.height = H + "px";
    var count = Math.floor(W * H / 5000);
    if (count < 60) count = 60;
    if (count > 320) count = 320;
    while (flakes.length < count) flakes.push(make(true));
    flakes.length = count;
  }
  resize();
  if (window.addEventListener) window.addEventListener("resize", resize, false);
  else window.onresize = resize;

  setInterval(function () {
    if (W !== vw() || H !== vh()) resize();
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.speed * SPEED * 2;
      f.phase += 0.04 * SPEED;
      if (f.y - f.size * 3 > H) { flakes[i] = make(false); f = flakes[i]; }
      ctx.fillStyle = f.colour;
      ctx.font = '700 ' + (f.size * 2.6).toFixed(1) + 'px "Open Sans","Segoe UI",Arial,sans-serif';
      ctx.fillText("G", f.x + Math.sin(f.phase) * f.drift, f.y);
    }
  }, TICK);
})();
</script>
