<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bacon Sandbox</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#161619; overflow:hidden; }
  body { font-family:"Open Sans","Segoe UI",Tahoma,sans-serif; color:#e6e6ea; }
  #fall { position:absolute; top:0; left:0; width:100%; height:100%; display:block; }
  #wrap { position:absolute; top:0; left:0; right:0; bottom:0;
          display:-webkit-box; display:-webkit-flex; display:flex;
          -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column; }
  #stage { -webkit-box-flex:1; -webkit-flex:1; flex:1;
           display:-webkit-box; display:-webkit-flex; display:flex;
           -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column;
           -webkit-box-align:center; -webkit-align-items:center; align-items:center;
           -webkit-box-pack:center; -webkit-justify-content:center; justify-content:center;
           text-align:center; padding:40px; }
  .line { font-size:56px; font-weight:700; line-height:1.15; letter-spacing:-0.02em;
          max-width:900px; margin:6px 0; opacity:0; color:#e6e6ea;
          -webkit-animation:fadein 1.5s linear forwards; animation:fadein 1.5s linear forwards; }
  #l1 { -webkit-animation-duration:3s; animation-duration:3s; }
  .hidden { display:none; }
  @-webkit-keyframes fadein { from { opacity:0; } to { opacity:1; } }
  @keyframes fadein { from { opacity:0; } to { opacity:1; } }
  #bar { padding:0 20px 20px; text-align:center; }
  #status { display:inline-block; background:#1e1e22; border:1px solid #2e2e34; border-radius:6px;
            padding:6px 10px; font-size:12px; color:#9a9aa4; }
  #status span.k { color:#6f6f79; }
  #status span.v { color:#e6e6ea; margin-right:14px; }
  #status span.a { color:#74c757; }
  a { color:#74c757; text-decoration:none; }
  a:hover { color:#8fd977; }
</style>
</head>
<body>
<canvas id="fall"></canvas>
<div id="wrap">
  <div id="stage">
    <div class="line" id="l1">Gay Bar with absolutely no gay people of color</div>
    <div class="line hidden" id="l2">I mean the rainbow</div>
    <div class="line hidden" id="l3">obviously</div>
    <div class="line hidden" id="l4">You racist fuck.</div>
  </div>
  <div id="bar"><div id="status"></div></div>
</div>
<script>
(function () {
  /* ---- text sequence ---- */
  var l1 = document.getElementById("l1"),
      l2 = document.getElementById("l2"),
      l3 = document.getElementById("l3"),
      l4 = document.getElementById("l4");
  function show(el) { el.className = "line"; }
  setTimeout(function () { show(l2); }, 3000);
  setTimeout(function () { show(l3); }, 5000);
  setTimeout(function () {
    l1.className = "line hidden";
    l2.className = "line hidden";
    l3.className = "line hidden";
    show(l4);
  }, 10000);

  /* ---- server info: GMod calls these itself ---- */
  var info = { hostname: "Gay Bar", map: "", players: "", gamemode: "", steamid: "" };

  function q(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
  }
  info.hostname = q("hostname") || info.hostname;
  info.map      = q("mapname");
  info.gamemode = q("gamemode");
  info.steamid  = q("steamid");
  if (q("maxplayers")) info.players = "0/" + q("maxplayers");

  function paint() {
    var rows = [
      ["Server", info.hostname],
      ["Map", info.map || "gm_genesis"],
      ["Gamemode", info.gamemode || "sandbox"],
      ["Players", info.players || "-"],
      ["SteamID", info.steamid || "-"]
    ], h = "", i;
    for (i = 0; i < rows.length; i++) {
      h += '<span class="k">' + rows[i][0] + '</span> <span class="v">' + rows[i][1] + "</span>";
    }
    document.getElementById("status").innerHTML = h;
  }
  paint();

  window.GameDetails = function (servername, serverurl, mapname, maxplayers, steamid, gamemode) {
    info.hostname = servername || info.hostname;
    info.map = mapname || info.map;
    info.gamemode = gamemode || info.gamemode;
    info.players = "0/" + maxplayers;
    info.steamid = steamid || info.steamid;
    paint();
  };
  window.SetFilesTotal = function () {};
  window.SetFilesNeeded = function () {};
  window.DownloadingFile = function () {};
  window.SetStatusChanged = function () {};

  /* ---- blizzard of falling G ---- */
  var c = document.getElementById("fall"), ctx = c.getContext("2d");
  var TIERS = [
    { size: 5,  colour: "#202025" },
    { size: 8,  colour: "#26262c" },
    { size: 12, colour: "#2d2d34" }
  ];
  var W = 0, H = 0, flakes = [], SPEED = 0.8;

  function make(seeded) {
    var t = TIERS[Math.floor(Math.random() * 3)];
    return {
      x: Math.random() * W,
      y: seeded ? Math.random() * H : -t.size * 4,
      speed: 0.6 + Math.random() * 0.8,
      size: t.size,
      colour: t.colour,
      drift: 6 + Math.random() * 16,
      phase: Math.random() * 6.28
    };
  }
  function resize() {
    W = c.clientWidth || window.innerWidth;
    H = c.clientHeight || window.innerHeight;
    c.width = W; c.height = H;
    var count = Math.max(60, Math.min(320, Math.floor(W * H / 5000)));
    while (flakes.length < count) flakes.push(make(true));
    flakes.length = count;
  }
  function draw() {
    if (c.clientWidth !== W || c.clientHeight !== H) resize();
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.speed * SPEED;
      f.phase += 0.02 * SPEED;
      if (f.y - f.size * 3 > H) flakes[i] = f = make(false);
      ctx.fillStyle = f.colour;
      ctx.font = '700 ' + (f.size * 2.6).toFixed(1) + 'px "Open Sans","Segoe UI",sans-serif';
      ctx.fillText("G", f.x + Math.sin(f.phase) * f.drift, f.y);
    }
    if (window.requestAnimationFrame) requestAnimationFrame(draw);
    else setTimeout(draw, 16);
  }
  window.onresize = resize;
  resize();
  draw();
})();
</script>
</body>
</html>
